# Dependabot の PR に対して、依存関係のインストールとビルドが通るかを確認する軽量な CI。
# dependabot-auto-merge-complete.yml がこのワークフローの成功を見てマージする。
#
# PHPUnit（wp-env で WordPress を起動するため実行時間が長い）は従来どおり
# run-ci ラベル付きの PR でのみ実行する。人が作った PR ではこのワークフローは動かない。
name: Dependabot CI

on:
  pull_request:
    branches:
      - master
    # labeled を含めない。Dependabot は PR 作成直後に dependencies などのラベルを
    # 次々に付けるため、含めるとそのたびに起動して同じ内容を何度もビルドする。
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node のバージョンは php_unit_test.yml と同じく .node-version から読む
      - name: Read .node-version
        id: nodenv
        run: echo "NODEVERSION=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js (.node-version)
        uses: actions/setup-node@v4
        with:
          node-version: '${{ steps.nodenv.outputs.NODEVERSION }}'

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Install npm packages
        run: npm install

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist

      # php_unit_test.yml のビルド手順と同じ。wp-env の起動・PHPUnit の実行は行わない
      - name: Build
        run: npm run build

      # js/ 配下のスクリプトの構文確認（node --check）だけを行う軽い処理
      - name: Test
        run: npm test
